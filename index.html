<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigília Carmesim</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050308; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; }
    /* The HUD is laid out for 16:9, so the game keeps that shape and letterboxes. */
    #game { position: relative; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); }
    #canvas { display: block; width: 100%; height: 100%; background: #050308; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #f8d172; text-align: center; padding: 16px; }
    #loading h1 { margin: 0; font-size: clamp(28px, 6vw, 56px); font-weight: normal; color: #db2433; }
    #track { width: min(60%, 420px); height: 6px; background: #241a2e; }
    #bar { width: 0; height: 100%; background: #db2433; }
    #fullscreen { position: absolute; right: 12px; bottom: 12px; padding: 6px 10px; border: 1px solid #f8d17255; background: #05030899; color: #f8d172; font: inherit; font-size: 13px; cursor: pointer; opacity: .55; }
    #fullscreen:hover { opacity: 1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>Vigília Carmesim</h1>
      <div id="track"><div id="bar"></div></div>
      <div id="status">Carregando...</div>
    </div>
    <button id="fullscreen" hidden>Tela cheia</button>
  </div>
  <script>
    const canvas = document.getElementById("canvas");
    const loading = document.getElementById("loading");
    const bar = document.getElementById("bar");
    const statusText = document.getElementById("status");
    const fullscreen = document.getElementById("fullscreen");

    const config = {
      dataUrl: "Build/Web.data.unityweb",
      frameworkUrl: "Build/Web.framework.js.unityweb",
      codeUrl: "Build/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Teste",
      productName: "Vigilia Carmesim",
      productVersion: "1.0",
      devicePixelRatio: 1,
    };

    const fail = (message) => {
      loading.hidden = false;
      statusText.textContent = "Não foi possível iniciar o jogo: " + message;
    };

    const script = document.createElement("script");
    script.src = "Build/Web.loader.js";
    script.onerror = () => fail("arquivos do jogo não encontrados.");
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        bar.style.width = Math.round(progress * 100) + "%";
      }).then((instance) => {
        loading.hidden = true;
        fullscreen.hidden = false;
        fullscreen.onclick = () => instance.SetFullscreen(1);
        canvas.focus();
      }).catch(fail);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
